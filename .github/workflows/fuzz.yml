name: Fuzz

# The fuzz targets run for a few seconds in every CI run, because `go test`
# replays the committed corpus under testdata/fuzz/ and nothing more. This
# workflow is the other half: actual fuzzing, ten minutes per target, once a
# night, where finding a new input is worth the wall-clock time.
#
# A crasher fails the job and is uploaded as an artifact. It belongs in
# go/<pkg>/testdata/fuzz/<Target>/ afterwards, committed with a comment naming
# the rule it violates, so that every later run replays it in seconds.
on:
  schedule:
    # 03:17 UTC — an odd minute, because everything scheduled on the hour
    # queues behind everything else scheduled on the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  fuzz:
    name: ${{ matrix.package }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Ten minutes of fuzzing, plus the toolchain and the build.
    timeout-minutes: 25
    strategy:
      # One target crashing is a reason to look at that target, not a reason
      # to stop fuzzing the other five.
      fail-fast: false
      matrix:
        # `go test -fuzz` takes a pattern that must match exactly one target,
        # so the targets are enumerated rather than discovered. A new
        # FuzzXxx function has to be added here to be fuzzed nightly.
        include:
          - package: dcbor
            target: FuzzRoundTrip
          - package: entity
            target: FuzzDecodeMolecule
          - package: entity
            target: FuzzDecodeAtomAndBond
          - package: block
            target: FuzzDecodeBlock
          - package: privacy
            target: FuzzOpen
          - package: privacy
            target: FuzzOpenPlaintext
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Fuzz
        env:
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        # -run '^$' skips the ordinary tests: this job is here to fuzz, and a
        # unit-test failure would be reported by the Go workflow anyway. A
        # crasher makes this step, and the job, fail.
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime=10m "./${PKG}/"

      - name: Upload the crasher
        # Only on failure, and only the inputs the fuzzer wrote: the generated
        # corpus lives in the build cache and is not interesting, but the file
        # under testdata/fuzz/ is the reproducer, and it is what has to be
        # committed to turn this crash into a regression test.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crasher-${{ matrix.package }}-${{ matrix.target }}
          path: go/${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: warn
          retention-days: 30
