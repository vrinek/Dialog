name: Interop

# The two implementations against each other (interop/README.md): a Go server
# answering a TypeScript client, a TypeScript server answering a Go client, and
# the assertion that both directions put the same blocks in the same store.
#
# Each implementation's own job already proves it agrees with the specification
# and with vectors/. Neither proves the thing an interoperability profile exists
# for, which is what this job runs: three scenarios — three honest chains, a
# forked chain, and two chains claiming one author with no block in common —
# every combination of who is serving and who is syncing, and one summary
# document that must come out identical from both sides.
#
# It runs on every push and pull request rather than only on changes under
# interop/, because the changes that break it are changes to go/ and ts/.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross:
    name: Go and TypeScript against each other
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job only reads the repository. Keeping the token in
          # .git/config afterwards would hand it to every later step, and to
          # anything those steps run.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go/go.mod's `toolchain` directive is the version the library and
          # its binaries are built with, here as everywhere else.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install the TypeScript implementation's dependencies
        run: npm ci
        working-directory: ts

      - name: Run the harness
        # It builds both Go binaries, checks that the generated fixtures and
        # expectations are current, starts servers on loopback ports the kernel
        # picks, and runs every scenario in every combination. Nothing listens
        # on a public interface and nothing outlives the script.
        run: ./interop/run.sh
