name: Go

# The Go reference implementation and the conformance vectors it generates.
# The PDF pipeline is a separate workflow (build-and-release.yml) and is not
# affected by anything here.
#
# The cache-poisoning suppression below is deliberate. zizmor sees a tag-push
# trigger next to setup-go's module cache and warns that a poisoned cache could
# reach a published artifact. This job publishes nothing — it builds, tests,
# lints and diffs the vectors, and uploads no artifact and cuts no release — so
# there is nothing for a poisoned cache to end up inside. Releases are made by
# build-and-release.yml, which caches nothing.
on: # zizmor: ignore[cache-poisoning]
  push:
    branches:
      - '**'
    # Go module releases are tagged go/vX.Y.Z (a subdirectory module needs the
    # directory prefix for `go get` to resolve it). Building the tag proves the
    # module is sound before anyone depends on it.
    tags:
      - 'go/v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  check:
    name: Build, vet, lint, test, difftest, vectors
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the repository. Keeping the token in
          # .git/config afterwards would hand it to every later step, and to
          # anything those steps run.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go/go.mod is the single source of truth for the toolchain version:
          # setup-go reads its `toolchain` directive, and even if it did not,
          # GOTOOLCHAIN=auto would make the go command switch to it. Nothing
          # here has to be updated to move the version.
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/internal/difftest/go.sum

      - name: Check formatting
        # gofmt -l exits 0 whether or not it found anything, so the file list
        # is the failure signal and has to be tested for emptiness.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean; run 'gofmt -w .' in go/"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -race because the store is used concurrently and a data race there
        # would corrupt a chain; -shuffle=on because a suite whose order
        # matters is hiding shared state, and this one asserts a great deal
        # about determinism.
        run: go test -count=1 -race -shuffle=on ./...

      - name: Lint
        # The pinned golangci-lint from tools.go.mod, never a distribution's:
        # a different version disagrees about what a finding is, and this run
        # is the arbiter. It carries the ruleguard determinism rule.
        run: go tool -modfile=tools.go.mod golangci-lint run

      - name: Check for known vulnerabilities
        # govulncheck fails only on advisories this code actually reaches, so
        # a red run here names a call path, not a version number.
        run: go tool -modfile=tools.go.mod govulncheck ./...

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      # The differential-fuzzing module (go/internal/difftest). It is a module
      # of its own — it carries a second CBOR implementation as an oracle,
      # which is exactly the dependency the library must not have — so `go
      # build ./...` and `go vet ./...` above do not reach it: a directory with
      # its own go.mod is excluded from the parent module's package patterns.
      # `gofmt -l .` above does reach it, since gofmt walks directories and
      # knows nothing about modules, so there is no formatting step here.
      #
      # Only the seed corpus is replayed. That is not a token run: both targets
      # are seeded from vectors/dcbor.json, so every conformance byte string
      # goes through both comparisons in a second or two. Actual fuzzing is
      # fuzz.yml's job, ten minutes per target, once a night.
      - name: Build the differential-fuzzing module
        working-directory: go/internal/difftest
        run: go build ./...

      - name: Vet the differential-fuzzing module
        working-directory: go/internal/difftest
        run: go vet ./...

      - name: Test the differential-fuzzing module
        working-directory: go/internal/difftest
        run: go test -count=1 -shuffle=on ./...

      - name: Check the differential-fuzzing module's go.mod tidiness
        working-directory: go/internal/difftest
        run: go mod tidy -diff

      - name: Regenerate the conformance vectors
        run: go run ./cmd/genvectors

      - name: Check the conformance vectors are current
        working-directory: .
        run: |
          if ! git diff --exit-code vectors/; then
            echo "::error::vectors/ does not match what the implementation produces."
            echo "Run 'cd go && go run ./cmd/genvectors' and commit the result."
            echo "Review that diff as a breaking change: these bytes are the interop"
            echo "contract, and every implementation that matched the old ones is"
            echo "broken by the new ones."
            exit 1
          fi
