name: Build and Release PDF

on:
  push:
    branches:
      - '**'
    # Specification releases are tagged vX.Y.Z; the Go module is tagged
    # go/vX.Y.Z, which a pattern anchored at "v" cannot match (a filter
    # pattern's * does not cross a /). The exclusion says so explicitly: a Go
    # module release is not a specification release and MUST NOT publish a PDF
    # under its tag name.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '!go/**'
  workflow_dispatch:

env:
  # Base filename without extension - version will be appended for tags
  BASE_FILENAME: "dialog-protocol"

# A workflow with no permissions block inherits whatever the repository's
# default happens to be, which is not a decision anyone made here. Read-only is
# the floor; the release job raises itself to contents: write, which is the one
# job that has any business writing anything.
permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes anything; leaving the token in .git/config for
          # the rest of the job only widens what a compromised build step can
          # reach.
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser

      # Every step below takes the values it needs through env rather than by
      # interpolating ${{ }} into the script: a tag name is attacker-chosen
      # text, and pasted into a shell it is a command, not a string.
      - name: Set version variables
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            echo "VERSION=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "PDF_FILENAME=dialog-protocol-${REF_NAME}.pdf" >> "$GITHUB_OUTPUT"
            echo "Building with version suffix: ${REF_NAME}"
          else
            echo "VERSION=" >> "$GITHUB_OUTPUT"
            echo "PDF_FILENAME=dialog-protocol-spec.pdf" >> "$GITHUB_OUTPUT"
            echo "Building without version suffix"
          fi

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/inject-version.sh
          ./scripts/inject-version.sh

      - name: Build PDF
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
        run: |
          chmod +x build-pdf.sh
          if [ -n "$VERSION" ]; then
            ./build-pdf.sh --version "$VERSION"
          else
            ./build-pdf.sh
          fi

      - name: Validate PDF exists
        env:
          PDF_PATH: ${{ steps.vars.outputs.PDF_FILENAME }}
        run: |
          if [ ! -f "$PDF_PATH" ]; then
            echo "Error: PDF was not generated (expected: $PDF_PATH)"
            exit 1
          fi

          PDF_SIZE=$(stat -c%s "$PDF_PATH")
          if [ "$PDF_SIZE" -lt 1024 ]; then
            echo "Error: PDF is too small (less than 1KB)"
            exit 1
          fi

          echo "✓ PDF generated successfully: ${PDF_PATH} (${PDF_SIZE} bytes)"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dialog-protocol-pdf-${{ github.sha }}
          path: ${{ steps.vars.outputs.PDF_FILENAME }}
          retention-days: 30

  release:
    needs: build-and-upload
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Set version variables
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "VERSION=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "PDF_FILENAME=dialog-protocol-${REF_NAME}.pdf" >> "$GITHUB_OUTPUT"

      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dialog-protocol-pdf-${{ github.sha }}
          path: ./artifacts

      - name: Rename artifact for release
        env:
          PDF_FILENAME: ${{ steps.vars.outputs.PDF_FILENAME }}
        run: |
          cd ./artifacts
          # The build job may already emit the versioned filename; rename only
          # when the downloaded artifact's name differs, so both cases work.
          for f in ./*.pdf; do
            [ "$f" = "./$PDF_FILENAME" ] || mv "$f" "$PDF_FILENAME"
          done
          test -f "$PDF_FILENAME"

      - name: Create/Update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ./artifacts/${{ steps.vars.outputs.PDF_FILENAME }}
          name: Release ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
