name: Build and Release PDF

on:
  push:
    branches:
      - '**'
    # Specification releases are tagged vX.Y.Z; the Go module is tagged
    # go/vX.Y.Z, which a pattern anchored at "v" cannot match (a filter
    # pattern's * does not cross a /). The exclusion says so explicitly: a Go
    # module release is not a specification release and MUST NOT publish a PDF
    # under its tag name.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '!go/**'
  workflow_dispatch:

env:
  # Base filename without extension - version will be appended for tags
  BASE_FILENAME: "dialog-protocol"

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser

      - name: Set version variables
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "PDF_FILENAME=dialog-protocol-${VERSION}.pdf" >> $GITHUB_OUTPUT
            echo "Building with version suffix: ${VERSION}"
          else
            echo "VERSION=" >> $GITHUB_OUTPUT
            echo "PDF_FILENAME=dialog-protocol-spec.pdf" >> $GITHUB_OUTPUT
            echo "Building without version suffix"
          fi

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/inject-version.sh
          ./scripts/inject-version.sh

      - name: Build PDF
        run: |
          chmod +x build-pdf.sh
          if [[ -n "${{ steps.vars.outputs.VERSION }}" ]]; then
            ./build-pdf.sh --version "${{ steps.vars.outputs.VERSION }}"
          else
            ./build-pdf.sh
          fi

      - name: Validate PDF exists
        run: |
          PDF_FILE="${{ steps.vars.outputs.PDF_FILENAME }}"
          if [ ! -f "$PDF_FILE" ]; then
            echo "Error: PDF was not generated (expected: $PDF_FILE)"
            exit 1
          fi
          
          PDF_SIZE=$(stat -c%s "$PDF_FILE")
          if [ $PDF_SIZE -lt 1024 ]; then
            echo "Error: PDF is too small (less than 1KB)"
            exit 1
          fi
          
          echo "✓ PDF generated successfully: ${PDF_FILE} (${PDF_SIZE} bytes)"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialog-protocol-pdf-${{ github.sha }}
          path: ${{ steps.vars.outputs.PDF_FILENAME }}
          retention-days: 30

  release:
    needs: build-and-upload
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Set version variables
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "PDF_FILENAME=dialog-protocol-${VERSION}.pdf" >> $GITHUB_OUTPUT

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: dialog-protocol-pdf-${{ github.sha }}
          path: ./artifacts

      - name: Rename artifact for release
        run: |
          cd ./artifacts
          # The artifact is downloaded with the original filename from the build
          # Rename it to include version for the release upload
          mv *.pdf "${{ steps.vars.outputs.PDF_FILENAME }}"

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/${{ steps.vars.outputs.PDF_FILENAME }}
          name: Release ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
