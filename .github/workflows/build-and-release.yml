name: Build and Release PDF

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/inject-version.sh
          ./scripts/inject-version.sh

      - name: Build PDF
        run: |
          chmod +x build-pdf.sh
          ./build-pdf.sh

      - name: Validate PDF exists
        run: |
          if [ ! -f "dialog-protocol-spec.pdf" ]; then
            echo "Error: PDF was not generated"
            exit 1
          fi
          
          PDF_SIZE=$(stat -c%s "dialog-protocol-spec.pdf")
          if [ $PDF_SIZE -lt 1024 ]; then
            echo "Error: PDF is too small (less than 1KB)"
            exit 1
          fi
          
          echo "✓ PDF generated successfully: ${PDF_SIZE} bytes"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialog-protocol-spec-${{ github.sha }}
          path: dialog-protocol-spec.pdf
          retention-days: 30

  release:
    needs: build-and-upload
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: dialog-protocol-spec-${{ github.sha }}
          path: ./artifacts

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/dialog-protocol-spec.pdf
          name: Release ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
